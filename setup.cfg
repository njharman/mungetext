[tool:pytest]
addopts = --isort --flake8
norecursedirs = .git .cache .venv build dist *.egg *.egg-info  __pycache__

[isort]
line_length = 100
indent = '        '
multi_line_output = 4
balanced_wrapping = True

[flake8]
jobs = 4
enable-extensions=G
# Don't ignore E133!
hang_closing = True
per-file-ignores =
    # Tests don't need docstrings.
    tests/*.py:D100,D101,D102,D103,D106,E402
    # We import in init's for others to use.
    __init__.py:F401
ignore =
    D403,  # Ignore capitalization. ReST starting docstring.
    E121, E123, E126, W503, W504,  # Have to reset these defaults.
    # Line too long (82 > 79 characters).
    E501,
    # Piss off. Do not assign a lambda expression, use a def.
    E731,
    # D100 Modules don't need docstrings.
    # D106 Missing docstring in public nested class.
    # D107 Missing docstring in __init__: We put __init__ doc into class docstring.
    D100, D106, D107,
    # First line should be in imperative mood; try rephrasing: True, but too strict for test
    D401,
    # One way to do things! Always listcomp.
    C408,
    # Trailing comma is in fact a requirement.
    C416,
    # One way to do things! C408 Unnecessary list call.
    C819,
    # N??? Various naming conventions. Which are sane in general (and we all
    # follow them well enough) but have frequent, pragmatic reasons to violate them.
    N801, N802, N803, N805, N806, N812, N814,
    # No thank you: Change outer quotes to avoid escaping inner quotes.
    Q003
